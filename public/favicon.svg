<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Referenced by index.html since the first commit, but `public/` did not
    exist — so every page load took a 404 and the tab showed the browser's
    default page icon.

    `currentColor` is not available to a favicon, so the two themes are handled
    the only way an SVG icon can: a media query inside the document.
  -->
  <style>
    .mark { fill: #171717; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fafafa; } }
  </style>
